<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Djaoued-Cg Brand</title>
<style>
  :root {
    --bg:#f5f3ef; --bg2:#ebe7df; --card:#ffffff; --text:#1d1b19; --muted:#7a766f; --line:#e6e1d8;
    --accent:#b8893b; --accent2:#8a5f1c; --accent-soft:#f6ecd8; --on-accent:#fff;
    --bad:#c0392b; --bad-soft:#fbe9e6; --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(40,30,10,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f0e0d; --bg2:#171513; --card:#1a1816; --text:#f1ede6; --muted:#9b958b; --line:#2a2723;
      --accent:#d9a84e; --accent2:#f0c577; --accent-soft:#2b2417; --on-accent:#16110a;
      --bad:#f08a7e; --bad-soft:#3a1f1b; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; color:var(--text); font:15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
         background:radial-gradient(1200px 500px at 50% -10%, var(--bg2), var(--bg) 70%) no-repeat, var(--bg); min-height:100vh; padding-bottom:110px; }
  .wrap { max-width:860px; margin:0 auto; padding:0 18px; }

  /* header */
  header { padding:40px 0 22px; text-align:center; }
  .logo { width:56px; height:56px; margin:0 auto 14px; border-radius:16px; display:grid; place-items:center; font-size:26px;
          background:linear-gradient(135deg,var(--accent2),var(--accent)); color:var(--on-accent); box-shadow:var(--shadow); }
  h1 { margin:0; font-size:30px; letter-spacing:.3px; font-weight:700; }
  h1 span { color:var(--accent); }
  .tagline { color:var(--muted); margin-top:6px; }

  /* upload */
  .drop { border:1.5px dashed var(--line); border-radius:18px; padding:22px; text-align:center; color:var(--muted);
          background:color-mix(in srgb, var(--card) 70%, transparent); transition:.2s; }
  .drop.over { border-color:var(--accent); background:var(--accent-soft); color:var(--text); transform:scale(1.01); }
  .drop strong { color:var(--text); }
  .btn { cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); padding:8px 14px; border-radius:10px;
         font:inherit; transition:.15s; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { border-color:var(--accent); color:var(--accent2); }
  .btn.primary { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:var(--on-accent); border-color:transparent; font-weight:600; }
  .btn.primary:hover { color:var(--on-accent); filter:brightness(1.08); }
  .progress { height:5px; border-radius:99px; background:var(--line); margin-top:14px; overflow:hidden; display:none; }
  .progress i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s; }
  #uploadStatus { font-size:13px; margin-top:10px; min-height:1em; }

  /* toolbar */
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:26px 0 14px; }
  .count { font-weight:600; margin-right:auto; }
  .count small { color:var(--muted); font-weight:400; }
  .search { position:relative; flex:1 1 220px; max-width:320px; }
  .search input { width:100%; padding:10px 12px 10px 38px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  .search input:focus, .sort select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .search::before { content:"⌕"; position:absolute; left:13px; top:50%; transform:translateY(-52%); font-size:18px; color:var(--muted); }
  .sort select { padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; cursor:pointer; }

  /* tracks */
  .track { display:flex; align-items:center; gap:14px; padding:12px 14px; margin-bottom:10px; background:var(--card);
           border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); transition:.18s; }
  .track:hover { transform:translateY(-1px); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .track.playing { border-color:var(--accent); background:linear-gradient(90deg,var(--accent-soft),var(--card) 55%); }
  .play { width:46px; height:46px; flex:none; border:0; border-radius:50%; cursor:pointer; font-size:15px; display:grid; place-items:center;
          background:linear-gradient(135deg,var(--accent2),var(--accent)); color:var(--on-accent); box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent); transition:.15s; }
  .play:hover { transform:scale(1.07); }
  .meta { min-width:0; flex:1; }
  .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:plaintext; }
  .sub { color:var(--muted); font-size:13px; display:flex; gap:10px; align-items:center; margin-top:1px; }
  .eq { display:none; gap:2px; align-items:flex-end; height:12px; }
  .track.playing.live .eq { display:inline-flex; }
  .eq i { width:3px; background:var(--accent); border-radius:2px; animation:eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.2s } .eq i:nth-child(3){ animation-delay:.4s }
  @keyframes eq { 0%,100%{height:3px} 50%{height:12px} }
  .icon { width:38px; height:38px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line); background:transparent;
          color:var(--muted); cursor:pointer; font-size:16px; transition:.15s; flex:none; }
  .icon:hover { color:var(--accent2); border-color:var(--accent); }
  .icon.danger:hover { color:var(--bad); border-color:var(--bad); background:var(--bad-soft); }
  .empty { text-align:center; color:var(--muted); padding:60px 0; }
  .empty .big { font-size:42px; margin-bottom:6px; }

  /* player */
  #player { position:fixed; left:0; right:0; bottom:0; z-index:10; padding:12px 18px;
            background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(14px); border-top:1px solid var(--line); }
  #player .inner { max-width:860px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  #pbtn { width:42px; height:42px; }
  .now { width:210px; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:plaintext; }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12.5px; min-width:34px; }
  input[type=range] { flex:1; accent-color:var(--accent); cursor:pointer; }
  @media (max-width:640px) {
    h1 { font-size:24px; } header { padding-top:28px; }
    .now { display:none; } .count { width:100%; }
    .search { max-width:none; } .track { padding:10px; gap:10px; }
    .icon.dl span { display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">♪</div>
    <h1>Djaoued-Cg <span>Brand</span></h1>
    <div class="tagline">Our music library — listen, add songs, or remove the ones that don't fit.</div>
  </header>

  <div class="drop" id="drop">
    <div><strong>Drop MP3 files here</strong> to add them to the library</div>
    <div style="margin-top:12px"><button class="btn primary" id="pickBtn">＋ Choose files</button></div>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" multiple hidden>
    <div class="progress" id="progress"><i></i></div>
    <div id="uploadStatus"></div>
  </div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <div class="search"><input type="search" id="search" placeholder="Search songs…" aria-label="Search songs"></div>
    <div class="sort">
      <select id="sort" aria-label="Sort songs">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="az">Name A → Z</option>
      </select>
    </div>
  </div>

  <div id="list"></div>
</div>

<div id="player">
  <div class="inner">
    <button id="pbtn" class="play" aria-label="Play / pause">▶</button>
    <div class="now" id="now">Nothing playing</div>
    <span class="time" id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
    <span class="time" id="dur">0:00</span>
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
const $ = (s) => document.querySelector(s);
const audio = $('#audio');
let directUpload = false, tracks = [], query = '', sortBy = 'new', playingId = null;
try { sortBy = localStorage.getItem('sortBy') || 'new'; } catch {}
$('#sort').value = sortBy;

async function api(url, opts = {}) {
  const isForm = opts.body instanceof FormData;
  const r = await fetch(url, { ...opts,
    headers: opts.body && !isForm ? { 'Content-Type':'application/json' } : undefined,
    body: opts.body && !isForm ? JSON.stringify(opts.body) : opts.body });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (s) => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const mb = (b) => (b/1048576).toFixed(1) + ' MB';
const when = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }); };

function sorted(list) {
  const a = [...list];
  if (sortBy === 'az') return a.sort((x, y) => x.title.localeCompare(y.title));
  const t = (x) => +new Date(x.addedAt) || 0;
  return a.sort((x, y) => sortBy === 'old' ? t(x) - t(y) : t(y) - t(x));
}

function render() {
  const q = query.toLowerCase();
  const shown = sorted(tracks.filter(t => !q || t.title.toLowerCase().includes(q)));
  $('#count').innerHTML = `${tracks.length} song${tracks.length === 1 ? '' : 's'}` + (q ? ` <small>· ${shown.length} match${shown.length === 1 ? '' : 'es'}</small>` : '');
  if (!shown.length) {
    $('#list').innerHTML = `<div class="empty"><div class="big">🎵</div>${tracks.length ? 'No songs match your search.' : 'No songs yet — drop some MP3s above.'}</div>`;
    return;
  }
  const live = !audio.paused;
  $('#list').innerHTML = shown.map(t => `
    <div class="track ${t.id === playingId ? 'playing' : ''} ${t.id === playingId && live ? 'live' : ''}" data-id="${t.id}">
      <button class="play" data-act="play" aria-label="Play">${t.id === playingId && live ? '❚❚' : '▶'}</button>
      <div class="meta">
        <div class="title" title="${esc(t.title)}">${esc(t.title)}</div>
        <div class="sub"><span class="eq"><i></i><i></i><i></i></span><span>${mb(t.size)}</span><span>·</span><span>${when(t.addedAt)}</span></div>
      </div>
      <button class="icon dl" data-act="download" title="Download" aria-label="Download">⬇</button>
      <button class="icon danger" data-act="delete" title="Delete this song" aria-label="Delete">🗑</button>
    </div>`).join('');
}

$('#search').oninput = (e) => { query = e.target.value; render(); };
$('#sort').onchange = (e) => { sortBy = e.target.value; try { localStorage.setItem('sortBy', sortBy); } catch {} render(); };

$('#list').onclick = async (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = btn.closest('.track').dataset.id; const t = tracks.find(x => x.id === id);
  try {
    if (btn.dataset.act === 'play') return togglePlay(t);
    if (btn.dataset.act === 'download') { location.href = `/api/tracks/${id}/file?download=1`; return; }
    if (btn.dataset.act === 'delete') {
      if (!confirm(`Delete "${t.title}" for everyone? This can't be undone.`)) return;
      await api(`/api/tracks/${id}`, { method:'DELETE' });
      tracks = tracks.filter(x => x.id !== id);
      if (playingId === id) { audio.pause(); audio.removeAttribute('src'); playingId = null; $('#now').textContent = 'Nothing playing'; $('#pbtn').textContent = '▶'; }
      render();
    }
  } catch (err) { alert(err.message); }
};

/* upload */
async function uploadFiles(files) {
  files = [...files].filter(f => /^audio\//.test(f.type) || /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(f.name));
  if (!files.length) return;
  const bar = $('#progress'), fill = bar.firstElementChild; bar.style.display = 'block'; fill.style.width = '0';
  let done = 0;
  for (const f of files) {
    $('#uploadStatus').textContent = `Uploading ${++done}/${files.length}: ${f.name}`;
    try {
      if (directUpload) {
        const { upload } = await import('https://esm.sh/@vercel/blob@2.8.2/client');
        const safe = f.name.replace(/[\/\\?#%]+/g, '_');
        const blob = await upload('music/' + safe, f, { access:'public', handleUploadUrl:'/api/blob-upload', multipart: f.size > 20e6,
          onUploadProgress: (p) => { fill.style.width = (((done - 1) + p.percentage / 100) / files.length * 100) + '%'; } });
        tracks.unshift(await api('/api/tracks/register', { method:'POST', body:{ url: blob.url, filename: f.name, size: f.size } }));
      } else {
        const fd = new FormData(); fd.append('files', f);
        tracks.unshift(...await api('/api/tracks', { method:'POST', body:fd }));
      }
      render();
    } catch (err) { alert(`${f.name}: ${err.message}`); }
    fill.style.width = (done / files.length * 100) + '%';
  }
  $('#uploadStatus').textContent = `✓ ${files.length} song${files.length === 1 ? '' : 's'} added`;
  setTimeout(() => { bar.style.display = 'none'; }, 1500);
}
$('#pickBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = (e) => { uploadFiles(e.target.files); e.target.value = ''; };
const drop = $('#drop');
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => uploadFiles(e.dataTransfer.files));

/* player */
function togglePlay(t) {
  if (playingId === t.id) { audio.paused ? audio.play() : audio.pause(); return; }
  playingId = t.id; audio.src = `/api/tracks/${t.id}/file`; audio.play().catch(()=>{});
  $('#now').textContent = t.title; render();
}
$('#pbtn').onclick = () => { if (audio.getAttribute('src')) audio.paused ? audio.play() : audio.pause(); };
audio.addEventListener('play', () => { $('#pbtn').textContent = '❚❚'; render(); });
audio.addEventListener('pause', () => { $('#pbtn').textContent = '▶'; render(); });
audio.addEventListener('timeupdate', () => {
  $('#cur').textContent = fmt(audio.currentTime); $('#dur').textContent = fmt(audio.duration);
  if (!seeking) $('#seek').value = audio.duration ? (audio.currentTime / audio.duration) * 1000 : 0;
});
audio.addEventListener('ended', () => {
  const ids = [...document.querySelectorAll('.track')].map(r => r.dataset.id);
  const next = tracks.find(t => t.id === ids[ids.indexOf(playingId) + 1]);
  if (next) togglePlay(next);
});
let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; });
$('#seek').addEventListener('change', (e) => { audio.currentTime = (e.target.value / 1000) * audio.duration; seeking = false; });

(async () => {
  directUpload = !!(await api('/api/config').catch(() => ({}))).directUpload;
  tracks = await api('/api/tracks').catch(() => []); render();
})();
</script>
</body>
</html>
