<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Djaoued-Cg Brand</title>
<style>
  :root {
    --bg:#f6f6f4; --card:#fff; --text:#1c1c1a; --muted:#6f6f6a; --line:#e4e4df;
    --accent:#1c1c1a; --accent-text:#fff; --bad:#b3372f; --bad-bg:#fbe7e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141413; --card:#1e1e1c; --text:#ecece8; --muted:#9a9a93; --line:#2e2e2b;
      --accent:#ecece8; --accent-text:#141413; --bad:#f0948d; --bad-bg:#3a1f1d;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:90px; }
  header, main { max-width:900px; margin:0 auto; padding-left:16px; padding-right:16px; }
  header { padding-top:22px; padding-bottom:12px; }
  h1 { font-size:22px; margin:0; letter-spacing:.2px; }
  .tagline { color:var(--muted); font-size:14px; margin-top:2px; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); padding:7px 12px; border-radius:8px; }
  button:hover { border-color:var(--muted); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); background:var(--bad-bg); }
  input[type=search] { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--card); margin-bottom:12px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--muted); margin-bottom:14px; background:var(--card); }
  .drop.over { border-color:var(--accent); color:var(--text); }
  .track { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; display:flex; gap:12px; align-items:center; }
  .track.playing { border-color:var(--accent); }
  .play { width:42px; height:42px; border-radius:50%; padding:0; flex:none; }
  .meta { min-width:0; flex:1; }
  .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { color:var(--muted); font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  #player { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; }
  #player .inner { max-width:900px; margin:0 auto; display:flex; gap:12px; align-items:center; }
  #player input[type=range] { flex:1; }
  #player .now { width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; }
  @media (max-width:600px) { #player .now { display:none; } .track { flex-wrap:wrap; } .meta { flex-basis:60%; } }
</style>
</head>
<body>
<header>
  <h1>Djaoued-Cg Brand</h1>
  <div class="tagline">Music library · listen, add songs, or remove the ones that don't fit.</div>
</header>
<main>
  <div class="drop" id="drop">
    Drag MP3 files here, or <button id="pickBtn">choose files</button>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" multiple hidden>
    <div id="uploadStatus" class="sub"></div>
  </div>
  <input type="search" id="search" placeholder="Search songs…">
  <div id="list"></div>
</main>

<div id="player">
  <div class="inner">
    <button id="pbtn" class="play">▶</button>
    <div class="now" id="now">Nothing playing</div>
    <span class="time" id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span class="time" id="dur">0:00</span>
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
const $ = (s) => document.querySelector(s);
const audio = $('#audio');
let directUpload = false, tracks = [], query = '', playingId = null;

async function api(url, opts = {}) {
  const isForm = opts.body instanceof FormData;
  const r = await fetch(url, { ...opts,
    headers: opts.body && !isForm ? { 'Content-Type':'application/json' } : undefined,
    body: opts.body && !isForm ? JSON.stringify(opts.body) : opts.body });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (s) => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const mb = (b) => (b/1048576).toFixed(1) + ' MB';

function render() {
  const q = query.toLowerCase();
  const shown = tracks.filter(t => !q || t.title.toLowerCase().includes(q));
  if (!shown.length) { $('#list').innerHTML = `<div class="empty">${tracks.length ? 'No songs match.' : 'No songs yet — drop some MP3s above.'}</div>`; return; }
  $('#list').innerHTML = shown.map(t => `
    <div class="track ${t.id===playingId?'playing':''}" data-id="${t.id}">
      <button class="play" data-act="play" title="Play">${t.id===playingId && !audio.paused ? '❚❚' : '▶'}</button>
      <div class="meta">
        <div class="title">${esc(t.title)}</div>
        <div class="sub">${mb(t.size)}</div>
      </div>
      <button data-act="download" title="Download">⬇ Download</button>
      <button data-act="delete" class="danger" title="Delete this song" aria-label="Delete">🗑</button>
    </div>`).join('');
}

$('#search').oninput = (e) => { query = e.target.value; render(); };

$('#list').onclick = async (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const id = btn.closest('.track').dataset.id; const t = tracks.find(x => x.id === id);
  try {
    if (btn.dataset.act === 'play') return togglePlay(t);
    if (btn.dataset.act === 'download') { location.href = `/api/tracks/${id}/file?download=1`; return; }
    if (btn.dataset.act === 'delete') {
      if (!confirm(`Delete "${t.title}" for everyone? This can't be undone.`)) return;
      await api(`/api/tracks/${id}`, { method:'DELETE' });
      tracks = tracks.filter(x => x.id !== id);
      if (playingId === id) { audio.pause(); audio.removeAttribute('src'); playingId = null; $('#now').textContent = 'Nothing playing'; }
      render();
    }
  } catch (err) { alert(err.message); }
};

/* upload */
async function uploadFiles(files) {
  files = [...files].filter(f => /^audio\//.test(f.type) || /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(f.name));
  if (!files.length) return;
  let done = 0;
  for (const f of files) {
    $('#uploadStatus').textContent = `Uploading ${++done}/${files.length}: ${f.name}`;
    try {
      if (directUpload) {
        const { upload } = await import('https://esm.sh/@vercel/blob@2.8.2/client');
        const safe = f.name.replace(/[\/\\?#%]+/g, '_');
        const blob = await upload('music/' + safe, f, { access:'public', handleUploadUrl:'/api/blob-upload', multipart: f.size > 20e6 });
        tracks.unshift(await api('/api/tracks/register', { method:'POST', body:{ url: blob.url, filename: f.name, size: f.size } }));
      } else {
        const fd = new FormData(); fd.append('files', f);
        tracks.unshift(...await api('/api/tracks', { method:'POST', body:fd }));
      }
      render();
    } catch (err) { alert(`${f.name}: ${err.message}`); }
  }
  $('#uploadStatus').textContent = `Done — ${files.length} file(s) added.`;
}
$('#pickBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = (e) => { uploadFiles(e.target.files); e.target.value = ''; };
const drop = $('#drop');
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => uploadFiles(e.dataTransfer.files));

/* player */
function togglePlay(t) {
  if (playingId === t.id) { audio.paused ? audio.play() : audio.pause(); return; }
  playingId = t.id; audio.src = `/api/tracks/${t.id}/file`; audio.play().catch(()=>{});
  $('#now').textContent = t.title; render();
}
$('#pbtn').onclick = () => { if (audio.getAttribute('src')) audio.paused ? audio.play() : audio.pause(); };
audio.addEventListener('play', () => { $('#pbtn').textContent = '❚❚'; render(); });
audio.addEventListener('pause', () => { $('#pbtn').textContent = '▶'; render(); });
audio.addEventListener('timeupdate', () => {
  $('#cur').textContent = fmt(audio.currentTime); $('#dur').textContent = fmt(audio.duration);
  if (!seeking) $('#seek').value = audio.duration ? (audio.currentTime / audio.duration) * 1000 : 0;
});
audio.addEventListener('ended', () => {
  const shown = [...document.querySelectorAll('.track')].map(r => r.dataset.id);
  const next = tracks.find(t => t.id === shown[shown.indexOf(playingId) + 1]);
  if (next) togglePlay(next);
});
let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; });
$('#seek').addEventListener('change', (e) => { audio.currentTime = (e.target.value / 1000) * audio.duration; seeking = false; });

(async () => {
  directUpload = !!(await api('/api/config').catch(() => ({}))).directUpload;
  tracks = await api('/api/tracks').catch(() => []); render();
})();
</script>
</body>
</html>
